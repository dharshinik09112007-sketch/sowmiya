<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Snake Game</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="container">
        <h1>🐍 Snake Game</h1>

        <div class="score">
            Score: <span id="score">0</span>
        </div>

        <canvas id="game" width="400" height="400"></canvas>

        <button onclick="startGame()">Start Game</button>
        <button onclick="restartGame()">Restart</button>

        <div class="controls">
            <button onclick="changeDirection('UP')">⬆️</button>
            <div>
                <button onclick="changeDirection('LEFT')">⬅️</button>
                <button onclick="changeDirection('DOWN')">⬇️</button>
                <button onclick="changeDirection('RIGHT')">➡️</button>
            </div>
        </div>

        <p>Use Arrow Keys to Move Snake</p>
    </div>

    <script src="script.js"></script>
</body>
</html>
